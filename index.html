    <script>
      // Loading screen driver. The game reports real stages through window.__jkLoad; while its
      // JavaScript is still downloading the bar eases toward 40%.
      (function () {
        var el = document.getElementById('jk-load');
        if (!el) return;
        var fill = el.querySelector('.jl-fill'), pct = el.querySelector('.jl-pct'), label = el.querySelector('.jl-label'), tip = el.querySelector('.jl-tip'), bubs = el.querySelector('.jl-bubs');

          b.style.cssText = '--s:' + (1.5 + Math.random() * 5).toFixed(1) + ';--x:' + (Math.random() * 100).toFixed(1) + '%;--d:' + (7 + Math.random() * 8).toFixed(1) + 's;--w:-' + (Math.random() * 12).toFixed(1) + 's;--sway:' + ((Math.random() - 0.5) * 12).toFixed(1) + 'vw';
          bubs.appendChild(b);
        }
        var TIPS = [
          '<b>SLAM</b> from high up: the shockwave grows with the fall.',
          '<b>Belly bump</b> (slam on the ground) throws a whole crowd back.',
          'Jump the boss <b>shockwave rings</b>, step out of the red circles.',
          'A maxed weapon + its partner passive = an <b>evolution</b>.',
          'Stand next to a downed friend for a few seconds to <b>revive</b> them.',
          'Lure the horde through the <b>chainsaw gauntlet</b>.',
          'Press <b>5 – 8</b> to emote: hi, help, gg, lol.'
        ];
        var ti = Math.floor(Math.random() * TIPS.length);
        function nextTip() { tip.style.opacity = '0'; setTimeout(function () { tip.innerHTML = 'Tip: ' + TIPS[ti++ % TIPS.length]; tip.style.opacity = '1'; }, 350); }
        tip.innerHTML = 'Tip: ' + TIPS[ti++ % TIPS.length];
        var tipTimer = setInterval(nextTip, 4200);
        var t0 = performance.now(), target = 0, shown = 0, finished = false, failed = false;
        function frame() {
          var t = (performance.now() - t0) / 1000;
          var want = Math.max(target, target < 40 ? 38 * (1 - Math.exp(-t / 5)) : 0);
          shown += (want - shown) * (finished ? 0.3 : 0.12);
          fill.style.transform = 'scaleX(' + (shown / 100).toFixed(4) + ')';
          var p = Math.min(100, Math.floor(shown + (finished ? 0.5 : 0)));
          pct.textContent = p + '%';
          el.setAttribute('aria-valuenow', String(p));
          if (finished && shown > 99.3) { el.classList.add('out'); clearInterval(tipTimer); setTimeout(function () { el.remove(); }, 650); return; }
          if (!failed) requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
        window.__jkLoad = {
          set: function (p, text) { target = Math.max(target, Math.min(99, p)); if (text) label.textContent = text; },
          done: function () {
            target = 100; finished = true; label.textContent = 'Let’s jiggle!';

        };
      })();
